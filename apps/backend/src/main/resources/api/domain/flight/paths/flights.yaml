---

get:
  tags:
    - Flights
  parameters:
    - $ref: "../../../common/params/pagination-page.yaml"
    - $ref: "../../../common/params/pagination-size.yaml"
  summary: Get a paginated list of all flights
  operationId: getAllFlights
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schemas/paged-flight-read-response.yaml"

post:
  tags:
    - Flights
  summary: Create a new flight
  operationId: createFlight
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/flight-create-dto.yaml"
  responses:
    201:
      description: Created
      content:
        application/json:
          schema:
            $ref: "../schemas/flight-read-dto.yaml"
    400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '../../../common/schemas/problem-details.yaml'
    404:
      description: Airport or Airline not found
      content:
        application/json:
          schema:
            $ref: '../../../common/schemas/problem-details.yaml'
    409:
      description: Conflict - a flight with the same date, airline and flight number already exists
      content:
        application/json:
          schema:
            $ref: '../../../common/schemas/problem-details.yaml'