---

parameters:
  - $ref: '../common/params/id.yaml'

put:
  tags:
    - Countries
  summary: Update a specific country with the given ID
  operationId: updateCountryById
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/country/country-update-dto.yaml'
  responses:
    200:
      description: Country updated
      content:
        application/json:
          schema:
            $ref: '../../schemas/country/country-read-dto.yaml'
    400:
      description: Invalid input data
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/problem-details.yaml'
    404:
      description: Country not found
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/problem-details.yaml'
    409:
      description: Iso Code already exists
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/problem-details.yaml'

delete:
  tags:
    - Countries
  summary: Delete a country by its ID
  operationId: deleteCountryById
  responses:
    204:
      description: Country deleted
    400:
      description: Invalid ID supplied
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/problem-details.yaml'
    404:
      description: Country not found
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/problem-details.yaml'
    409:
      description: Country is still in use
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/problem-details.yaml'