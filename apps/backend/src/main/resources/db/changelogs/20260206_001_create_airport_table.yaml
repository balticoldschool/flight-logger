databaseChangeLog:
  - changeSet:
      id: 20260206_001
      author: christopher
      comment: create airport table
      changes:
        - createTable:
            tableName: airport
            columns:

              # ICAO Code
              - column:
                  name: icao_code
                  type: varchar(4)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_airport
                    minlength: 4
                    maxlength: 4

              # IATA Code
              - column:
                  name: iata_code
                  type: varchar(3)
                  constraints:
                    unique: true
                    nullable: false
                    uniqueConstraintName: uc_airport_iata
                    minlength: 3
                    maxlength: 3

              # Name
              - column:
                  name: name
                  type: varchar(127)
                  constraints:
                    nullable: false
                    minlength: 1

              # City
              - column:
                  name: city
                  type: varchar(127)
                  constraints:
                    nullable: false
                    minlength: 1

              # Country
              - column:
                  name: country_id
                  type: uuid
                  constraints:
                    nullable: false
                    referencedTableName: country
                    referencedColumnNames: id
                    foreignKeyName: fk_airport_country
                    onDelete: RESTRICT

              # Timezone
              - column:
                  name: timezone
                  type: varchar(64)
                  constraints:
                    nullable: false

        - rollback:
            dropTable:
              tableName: airport
              ifExists: true